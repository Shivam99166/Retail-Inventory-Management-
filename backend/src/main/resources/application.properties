# ===================================================================
# RetailHub Backend Configuration
# ===================================================================
# Server Port (Render & container hosts set $PORT dynamically)
server.port=${PORT:8080}
spring.application.name=Retail Inventory Backend

# Default profile (local development)
spring.profiles.default=dev
spring.config.import=optional:classpath:application-local.properties

# CORS Allowed Origins (Comma-separated for multiple origins, defaults to local Vite/CRA)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retail_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Defaults (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# In production (spring.profiles.active=prod), JWT_SECRET must be explicitly set and >= 256 bits (32+ chars).
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
