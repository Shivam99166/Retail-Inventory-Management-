# ===================================================================
# RetailHub Backend Production Configuration Override
# Active when SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# Server Port (Render sets $PORT dynamically)
server.port=${PORT:8080}

# PostgreSQL Database Configuration for Cloud DB
# Render PostgreSQL, Supabase, Neon, AWS RDS, etc.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (Production Optimized)
# Free tiers in cloud environments often cap max connections at 20-50
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=RetailHubProdHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA & Hibernate Production Settings
# In production, schema is maintained via migrations/schema.sql, ddl-auto=update safely keeps schema in sync
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Allowed Origins for Production
# Overridden with frontend Vercel URL in environment variable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://retailhub.vercel.app}

# JWT Configuration (Mandatory in production: >= 32 chars / 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
