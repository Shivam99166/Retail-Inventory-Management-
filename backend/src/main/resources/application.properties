# ===================================================================
# RetailHub Backend Configuration
# ===================================================================
server.port=8080
spring.application.name=Retail Inventory Backend

# Default profile (local development)
spring.profiles.default=dev

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retail_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# In production (spring.profiles.active=prod), JWT_SECRET must be explicitly set and >= 256 bits (32+ chars).
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
